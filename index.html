<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>모바일 박물관 가이드 — 메인</title>

<!-- Google Fonts: Noto Sans KR -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>모바일 박물관 가이드</h1>
  </header>

  <main class="container" id="main">
    <section class="grid-2x2" aria-label="메인 선택">

      <!-- 1) 박물관 소개: 제목 위, 사진 아래 -->
      <a class="tile t1" href="intro.html" style="--i:0">
        <h3 class="tile__title">박물관 소개</h3>
        <div class="thumb thumb--photo" style="background-image:url('assets/buyeo-card.jpg')"></div>
        <p class="tile__desc">전시 개요, 핵심 유물, 체험·교육 프로그램을 소개합니다.</p>
      </a>

      <!-- 2) 질문 → 추천 경로: 카드 전체에 블루 라이트 틴트 + 컬러 비주얼 블록 -->
      <a class="tile t2" href="qa.html" style="--i:1">
        <h3 class="tile__title">질문 → 추천 경로</h3>
        <div class="thumb thumb--soft t2-soft"></div>
        <p class="tile__desc">시간/관심사를 입력하면 맞춤 코스를 제안합니다.</p>
      </a>

      <!-- 3) 미리 정해진 추천 경로: 그린 라이트 틴트 -->
      <a class="tile t3" href="routes.html" style="--i:2">
        <h3 class="tile__title">미리 정해진 추천 경로</h3>
        <div class="thumb thumb--soft t3-soft"></div>
        <p class="tile__desc">#짧고굵게 #인스타스폿 #모든유물 #정독</p>
      </a>

      <!-- 4) 기타 정보: 오렌지 라이트 틴트 -->
      <a class="tile t4" href="etc.html" style="--i:3">
        <h3 class="tile__title">기타 정보</h3>
        <div class="thumb thumb--soft t4-soft"></div>
        <p class="tile__desc">인자탐 · SASA 소개와 프로젝트 수행 방법</p>
      </a>

    </section>
  </main>

  <script>
    // 첫 진입 시 카드 순차 등장
    window.addEventListener('DOMContentLoaded', () => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      requestAnimationFrame(() => document.body.classList.add('enter'));
    });
  </script>
</body>
</html>
