<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Q&A 기반 추천</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />

<style>
  /* 이 페이지 전용: 두 가지 선택 카드 레이아웃 */
  .choice-grid{
    display:grid; gap: var(--gap);
    grid-template-columns: 1fr 1fr;
    margin-top: var(--gap);
  }
  /* 카드 안 타이포 약간 조정 */
  .tile__title{ margin-bottom: 10px; }
  /* 모바일: 1열 + 정확한 중앙 정렬 + 적정 폭 */
  @media (max-width:480px){
    .choice-grid{ grid-template-columns: 1fr; justify-items: center; }
    .choice-grid .tile{
      aspect-ratio: 16/9;
      max-height: 200px;
      width: min(100%, 420px);
      padding: 18px 14px;
    }
  }
</style>
</head>
<body>
  <header class="header header--sub">
    <a class="back" href="index.html" aria-label="메인으로">←</a>
    <h1>코스 추천 방식 선택</h1>
  </header>

  <main class="container" id="main">
    <section class="choice-grid" aria-label="추천 방식 선택">
      <!-- 1) AI와 대화하기 -->
      <a class="tile t2" href="ai.html" target="_blank" rel="noopener" style="--i:0">
        <h3 class="tile__title">AI와 대화하기</h3>
        <p class="tile__desc">
          챗봇과 대화하며 맞춤 코스를 추천 받아보세요.
        </p>
      </a>

      <!-- 2) 설문조사 진행하기 -->
      <a class="tile t3" href="survey.html" style="--i:1">
        <h3 class="tile__title">직접 설계하기</h3>
        <p class="tile__desc">
          몇 가지 질문에 답하여 직접 코스를 설계해보세요 
        </p>
      </a>
    </section>
  </main>

  <script>
    // 카드 순차 등장 애니메이션(기존 스타일과 동일한 트리거)
    window.addEventListener('DOMContentLoaded', () => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      requestAnimationFrame(() => document.body.classList.add('enter'));
    });
  </script>
</body>
</html>
